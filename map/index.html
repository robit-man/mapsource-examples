<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mapsource API examples</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css">
<style>body{margin:0;background:#141a16;color:#e4e7db;font:15px system-ui}header{padding:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}button,select{font:inherit;padding:8px}#map{height:70vh}#message{padding:16px;overflow-wrap:anywhere}.maplibregl-popup{color:#172019}</style>
<script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js" defer></script><script type="module" src="/app.mjs"></script></head>
<body><header><strong>mapsource / map data example</strong><select id="style" aria-label="Basemap"><option value="dark">CARTO Dark</option><option value="light">CARTO Light</option></select><select id="category" aria-label="Feature category"><option value="cafes">Cafés</option><option value="buildings">Buildings</option><option value="parks">Parks</option></select><button id="query">Query this viewport</button></header><main><div id="map"></div><p id="message" role="status">Checking engine readiness. Click the map to sample elevation.</p></main></body></html>
